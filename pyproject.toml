[project]
name = "sfh"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "HantigC", email = "cristianhantig96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mistralai>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ipykernel==7.4.0",
    "ruff==0.16.9",
    "mypy>=2.4.0",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["deps", "data", "ipynbs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^deps/", "^data/", "^ipynbs/"]
warn_unreachable = true
pretty = true
